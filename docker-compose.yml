version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: incident_investigator_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: ai_incident_investigator
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_incident_investigator"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - incident_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: incident_investigator_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@db:5432/ai_incident_investigator
      SECRET_KEY: ${SECRET_KEY:-supersecretjwtkeyforincidentinvestigatorprod2026}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - incident_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: incident_investigator_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    networks:
      - incident_network

volumes:
  pgdata:
    driver: local

networks:
  incident_network:
    driver: bridge
