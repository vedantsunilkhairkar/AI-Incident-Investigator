apiVersion: apps/v1
kind: Deployment
metadata:
  name: incident-backend
  namespace: incident-investigator
  labels:
    app: incident-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: incident-backend
  template:
    metadata:
      labels:
        app: incident-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/vedantsunilkhairkar/incident-investigator-backend:latest
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: "postgresql://postgres:$(DB_PASSWORD)@postgres-service:5432/ai_incident_investigator"
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: incident-secrets
                  key: SECRET_KEY
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: incident-secrets
                  key: GEMINI_API_KEY
          resources:
            requests:
              memory: "256Mi"
              cpu: "150m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /docs
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: incident-investigator
spec:
  selector:
    app: incident-backend
  ports:
    - port: 8000
      targetPort: 8000
