<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background rounded squircle gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#080D1A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Outer shield neon border gradient -->
    <linearGradient id="shieldBorder" x1="8" y1="6" x2="56" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <!-- Shield inner fill gradient -->
    <linearGradient id="shieldFill" x1="12" y1="10" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#1E1B4B" stop-opacity="0.65" />
    </linearGradient>

    <!-- AI Investigation Spark / Lightning Bolt gradient -->
    <linearGradient id="sparkGrad" x1="20" y1="14" x2="44" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Incident alert pulse glow -->
    <radialGradient id="glow" cx="32" cy="32" r="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0" />
    </radialGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base squircle background with subtle border -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)" stroke="#1E293B" stroke-width="1.5" />
  
  <!-- Subtle ambient glow -->
  <circle cx="32" cy="32" r="22" fill="url(#glow)" />

  <!-- SRE Incident Shield (Outer) -->
  <path d="M32 9L15 15.5V28.5C15 40.5 22.3 50.8 32 54.5C41.7 50.8 49 40.5 49 28.5V15.5L32 9Z" 
        fill="url(#shieldFill)" 
        stroke="url(#shieldBorder)" 
        stroke-width="2.5" 
        stroke-linejoin="round" />

  <!-- Central Autonomous AI Core / Investigation Lightning Spark -->
  <path d="M34 16L22 32H33L29 48L43 30H31L34 16Z" 
        fill="url(#sparkGrad)" 
        stroke="#FFFFFF" 
        stroke-width="1"
        stroke-linejoin="round"
        filter="url(#neonGlow)" />

  <!-- Live Health Monitor Pulse Indicator (Emerald Green) -->
  <circle cx="45" cy="18" r="3.5" fill="#10B981" stroke="#064E3B" stroke-width="1" />
  <circle cx="45" cy="18" r="1.5" fill="#A7F3D0" />
</svg>
